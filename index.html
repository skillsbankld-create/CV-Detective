<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills Bank | CV Detective</title>
<style>
:root{--navy:#080828;--panel:#10103a;--panel2:#181850;--bg:#EBF4FF;--blue:#4D88E8;--orange:#F26A44;--yellow:#D4AF37;--cyan:#1FA463;--mute:#9db0d8;--line:#2a2a6a}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;background:var(--navy);color:var(--bg);line-height:1.7;padding:14px;min-height:100vh}
.wrap{max-width:840px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
header img{height:46px;border-radius:8px;background:#fff}
.sp{flex:1}
.lang{background:transparent;color:var(--bg);border:1.5px solid var(--blue);border-radius:99px;padding:4px 14px;font:inherit;cursor:pointer}
.lang:hover{background:var(--blue)}
.hud{display:none;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:14px}
.hud.on{display:flex}
.hud img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:top;background:var(--bg);border:2px solid var(--yellow)}
.hud .n{font-weight:700;line-height:1.2}.hud small{color:var(--mute)}
.xp{flex:1;min-width:90px}
.xpb{height:12px;background:var(--navy);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.xpb span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .8s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px}
h1{font-size:1.65rem;line-height:1.4;margin-bottom:6px}
h2{font-size:1.1rem;margin-bottom:10px;color:var(--yellow)}
.sub{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips span{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:.88rem}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.hero{background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;color:inherit;font:inherit;text-align:center;transition:transform .15s,border-color .15s}
.hero:hover,.hero:focus-visible{border-color:var(--yellow);transform:translateY(-4px)}
.hero img{width:100%;aspect-ratio:1;object-fit:cover;object-position:top;border-radius:12px;background:var(--bg);display:block}
.hero b{display:block;margin-top:8px;font-size:1.05rem}
label{display:block;font-weight:600;margin:14px 0 6px}
label em{color:var(--orange);font-style:normal}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--navy);color:var(--bg)}
textarea{min-height:100px;resize:vertical}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.drop{border:2px dashed var(--blue);border-radius:12px;padding:22px 12px;text-align:center;cursor:pointer;background:var(--navy)}
.drop:hover,.drop.over{background:var(--panel2)}
.btn{background:var(--orange);color:var(--navy);border:0;border-radius:12px;padding:12px 28px;font:inherit;font-weight:800;cursor:pointer;margin-top:16px}
.btn:hover{background:var(--yellow)}
.btn.alt{background:transparent;color:var(--bg);border:1.5px solid var(--blue)}
.err{color:var(--yellow);margin-top:10px;font-weight:600}
.hide{display:none!important}
.load{text-align:center;padding:40px 10px}
.spin{width:46px;height:46px;border:5px solid var(--line);border-top-color:var(--yellow);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}
.top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:104px;height:104px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;font-size:2.1rem;font-weight:800;line-height:1.1}
.ring small{display:block;font-size:.75rem;font-weight:400;color:var(--mute)}
.rank{display:inline-block;padding:3px 14px;border-radius:99px;font-weight:800;color:var(--navy);margin-bottom:4px}
.bar{margin:10px 0}.bar .t{display:flex;justify-content:space-between;font-size:.92rem}
.bar .b{height:10px;background:var(--navy);border-radius:9px;overflow:hidden}
.bar .b span{display:block;height:100%;background:var(--blue);border-radius:9px}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.bd{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:.85rem}
.bd i{display:block;font-size:1.8rem;font-style:normal}
.bd.off{opacity:.35;filter:grayscale(1)}
.bd.on{border-color:var(--yellow)}
ul.l{padding:0;list-style:none}
ul.l li{padding:8px 12px;margin:6px 0;border-radius:8px;background:var(--panel2);border-inline-start:5px solid var(--cyan)}
ul.bad li{border-color:var(--orange)}
.ex{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--panel2)}
.ex q{display:block;background:var(--navy);padding:6px 10px;border-radius:6px;margin-bottom:6px;color:var(--yellow)}
.ex b{color:var(--blue)}
.rw .o{color:var(--mute);text-decoration:line-through}
.rw .n{background:var(--navy);border-radius:8px;padding:8px 12px;margin-top:4px;border-inline-start:5px solid var(--cyan)}
.note{font-size:.82rem;color:var(--mute);text-align:center;margin-top:8px}
.card{border-top:3px solid var(--cyan)}
body{background-image:none}
.ksa{direction:ltr;font-size:1.15rem;background:#4D88E8;color:#080828;border-radius:12px;padding:8px 14px;margin-bottom:14px;text-align:center;font-weight:700;border-bottom:3px solid #FFBC3A}
.btn{background:var(--cyan);color:var(--navy)}
h3{font-size:.95rem;color:var(--mute);margin:14px 0 4px}
.chips.ok span{border-color:var(--cyan)}.chips.no span{border-color:var(--orange)}.chips.gd span{border-color:var(--yellow)}
</style>
</head>

<section id="p2" class="card hide">
  <h1 data-i="missionT"></h1>
  <p class="sub" data-i="missionS"></p>
  <label for="ind"><span data-i="indL"></span> <em>*</em></label>
  <input type="text" id="ind" list="inds" autocomplete="off">
  <datalist id="inds"></datalist>
  <label for="role"><span data-i="roleL"></span> <em>*</em></label>
  <input type="text" id="role">
  <label data-i="upL"></label>
  <div class="drop" id="drop" tabindex="0" role="button"><b id="fn" data-i="drop"></b></div>
  <input type="file" id="file" accept=".pdf,.txt" class="hide">
  <label for="txt" data-i="pasteL"></label>
  <textarea id="txt"></textarea>
  <div class="err hide" id="e2"></div>
  <button class="btn" id="go" data-i="go"></button>
</section>

<section id="p3" class="card load hide" aria-live="polite"><div class="spin"></div><h2 data-i="loading"></h2><p class="sub" id="msg"></p></section>
<section id="p4" class="hide"></section>
<p class="note" data-i="foot"></p>
</div>

<script>
/* API_URL: secure proxy that calls the Anthropic API (never put an API key in this file). Empty = demo mode. */
const API_URL="";
const MODEL="claude-sonnet-4-6";

const T={
ar:{title:"مهمة السيرة الذاتية",brief:"أداة تقيّم سيرتك الذاتية وفق المعايير الدولية وتناسب مجال عملك، وتمنحك نقاطًا وشارات وتوصيات قابلة للتطبيق. بعد التجربة ستكون قادرًا على تقييم سيرتك الذاتية وتحديد نقاط التحسين.",c1:"⏱ دقيقتان",c2:"🏆 نقاط وشارات",c3:"🎯 تحليل حسب مجالك",ksa:"CV Detective",found:"كلمات مفتاحية موجودة في سيرتك",missing:"كلمات مفتاحية للمجال غير موجودة",certs:"شهادات ومؤهلات يقدّرها المجال",kpis:"مؤشرات أداء شائعة في المجال",actions:"خطوات لرفع ملاءمتك للمجال",fitL:"ملاءمة المجال",indNote:"المقترحات للإضافة فقط إذا كانت صحيحة وموجودة فعلًا في خبرتك.",pick:"اختر شخصيتك لتبدأ",male:"موظف",female:"موظفة",nameT:"لنبدأ",nameL:"ما اسمك؟",next:"التالي",nameErr:"اكتب اسمك للمتابعة.",missionT:"المهمة: قيّم سيرتك",missionS:"ارفع سيرتك واحصل على نقاط خبرة (XP) بحسب جودتها.",indL:"المجال / القطاع",indErr:"المجال إلزامي: اختر أو اكتب قطاع عملك.",roleL:"المسمى الوظيفي المستهدف",roleErr:"المسمى الوظيفي إلزامي: اكتب الوظيفة التي تستهدفها.",upL:"ارفع سيرتك (PDF أو TXT)",drop:"اسحب الملف هنا أو اضغط للاختيار",pasteL:"أو الصق نص السيرة",go:"ابدأ التقييم",cvErr:"ارفع الملف أو الصق نصًا كاملًا.",fmtErr:"الصيغة غير مدعومة. ارفع PDF أو TXT.",sizeErr:"الحجم الأقصى 8 ميغابايت.",fail:"تعذّر التقييم. حاول مرة أخرى.",loading:"جارٍ تحليل سيرتك...",msgs:["قراءة الهيكل والمحتوى","فحص الإنجازات والأرقام","مطابقة متطلبات المجال","اختبار توافق ATS"],foot:"التقييم آلي لأغراض التعلم ولا يغني عن مراجعة مختص.",score:"نقطة",overall:"نتيجتك الإجمالية",cats:"مهاراتك",badges:"الشارات",ind:"ملاءمتك للمجال",str:"أبرز 5 نقاط قوة",iss:"أهم 5 نقاط للتحسين",ex:"أمثلة من سيرتك",prob:"المشكلة: ",why:"لماذا يهم: ",fix:"التحسين: ",rw:"أعد صياغة 3 عبارات",again:"ابدأ من جديد",ranks:["مبتدئ","نجم صاعد","محترف","خبير"],verd:{ready:"جاهزة للتقديم",minor:"تحتاج تحسينات بسيطة",significant:"تحتاج تحسينًا جوهريًا"},cl:["الهيكل","المحتوى","الإنجازات","اللغة","ATS","الانطباع"],inds:["التقنية المالية","الأدوية والصيدلة","الرعاية الصحية","البنوك","التقنية","التعليم","التجزئة","الطاقة والنفط","الاستشارات","الاتصالات","القطاع الحكومي","العقارات والإنشاءات"]},
en:{title:"CV Quest",brief:"A tool that reviews your CV against international standards and your industry, giving you points, badges, and practical feedback. After playing, you'll be able to evaluate your own CV and spot what to improve.",c1:"⏱ 2 minutes",c2:"🏆 Points & badges",c3:"🎯 Industry-specific",ksa:"CV Detective",found:"Industry keywords found in your CV",missing:"Industry keywords missing",certs:"Certifications the industry values",kpis:"Common KPIs in this industry",actions:"Steps to improve industry fit",fitL:"Industry fit",indNote:"Suggestions are to be added only if true and part of your real experience.",pick:"Choose your character to start",male:"Player",female:"Player",nameT:"Let's start",nameL:"What's your name?",next:"Next",nameErr:"Enter your name to continue.",missionT:"Mission: review your CV",missionS:"Upload your CV and earn XP based on its quality.",indL:"Industry / sector",indErr:"Industry is required: pick or type your sector.",roleL:"Target job title",roleErr:"Target job title is required: enter the role you are aiming for.",upL:"Upload your CV (PDF or TXT)",drop:"Drag the file here or click to choose",pasteL:"Or paste your CV text",go:"Start review",cvErr:"Upload a file or paste the full text.",fmtErr:"Unsupported format. Upload a PDF or TXT.",sizeErr:"Maximum size is 8 MB.",fail:"Review failed. Please try again.",loading:"Analyzing your CV...",msgs:["Reading structure and content","Checking achievements and numbers","Matching industry expectations","Testing ATS compatibility"],foot:"Automated review for learning purposes; not a substitute for a professional.",score:"pts",overall:"Your overall score",cats:"Your skills",badges:"Badges",ind:"Industry fit",str:"Top 5 strengths",iss:"Top 5 areas to improve",ex:"Examples from your CV",prob:"Issue: ",why:"Why it matters: ",fix:"Improvement: ",rw:"Rewrite 3 weak statements",again:"Start again",ranks:["Rookie","Rising Star","Pro","Master"],verd:{ready:"Ready to apply",minor:"Needs minor improvements",significant:"Needs significant improvement"},cl:["Structure","Content","Impact","Language","ATS","Recruiter"],inds:["Fintech","Pharma","Healthcare","Banking","Technology","Education","Retail","Energy & Oil","Consulting","Telecom","Government","Real Estate & Construction"]}};
const KEYS=["structure","content","achievements","language","ats","recruiter"],MAX=[20,20,20,15,15,10],ICO=["🧱","📋","🚀","✍️","🤖","👀"];
const RC=["var(--orange)","var(--yellow)","var(--blue)","var(--cyan)"];
const $=i=>document.getElementById(i);
let L="ar",gender=null,name="",xp=0,fileData=null,last=null;
const t=k=>T[L][k];

function applyLang(){
  document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  $("lang").textContent=L==="ar"?"English":"عربي";
  $("nm").placeholder=L==="ar"?"مثال: سارة":"e.g. Sara";
  $("ind").placeholder=L==="ar"?"مثال: التقنية المالية":"e.g. Fintech";
  $("txt").placeholder=L==="ar"?"الصق النص هنا...":"Paste text here...";
  $("inds").innerHTML=t("inds").map(x=>`<option value="${x}">`).join("");
  if(name)hud();if(last)render(last);
}
$("lang").onclick=()=>{L=L==="ar"?"en":"ar";applyLang()};

function show(id){["p0","p1","p2","p3","p4"].forEach(p=>$(p).classList.toggle("hide",p!==id));window.scrollTo({top:0})}
function err(id,m){const e=$(id);e.textContent=m||"";e.classList.toggle("hide",!m)}
function rankIdx(s){return s<50?0:s<70?1:s<85?2:3}
function hud(){$("hud").classList.add("on");$("hName").textContent=name;$("hRank").textContent=t("ranks")[rankIdx(xp>100?xp:0)>0&&last?rankIdx(last.overall):0];$("xpt").textContent=xp+" XP";$("xpf").style.width=Math.min(100,xp/1.4)+"%"}
function addXp(n){xp+=n;hud()}

document.querySelectorAll(".hero").forEach(b=>b.onclick=()=>{gender=b.dataset.g;$("hAv").src=b.querySelector("img").src;show("p1");$("nm").focus()});
$("b1").onclick=()=>{const v=$("nm").value.trim();if(!v){err("e1",t("nameErr"));return}err("e1");name=v;addXp(10);show("p2")};
$("nm").onkeydown=e=>{if(e.key==="Enter")$("b1").click()};

const drop=$("drop"),fi=$("file");
drop.onclick=()=>fi.click();
drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fi.click()}};
["dragover","dragenter"].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>pick(e.dataTransfer.files[0]));
fi.onchange=()=>pick(fi.files[0]);
function pick(f){
  err("e2");if(!f)return;
  const pdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name);
  if(!pdf&&!/\.txt$/i.test(f.name)){err("e2",t("fmtErr"));return}
  if(f.size>8e6){err("e2",t("sizeErr"));return}
  const r=new FileReader();
  r.onload=()=>{fileData=pdf?{type:"pdf",data:r.result.split(",")[1]}:{type:"txt",data:r.result};$("fn").removeAttribute("data-i");$("fn").textContent="✓ "+f.name;addXp(10)};
  pdf?r.readAsDataURL(f):r.readAsText(f);
}

$("go").onclick=async()=>{
  const ind=$("ind").value.trim(),pasted=$("txt").value.trim();
  if(!ind){err("e2",t("indErr"));$("ind").focus();return}
  if(!$("role").value.trim()){err("e2",t("roleErr"));$("role").focus();return}
  if(!fileData&&pasted.length<80){err("e2",t("cvErr"));return}
  err("e2");addXp(10);show("p3");
  let i=0;const m=t("msgs");$("msg").textContent=m[0];
  const tm=setInterval(()=>$("msg").textContent=m[++i%m.length],2500);
  try{last=await evaluate(ind,pasted);xp=30+last.overall;render(last);show("p4")}
  catch(e){show("p2");err("e2",t("fail"))}
  clearInterval(tm);
};

function sys(){return `You are an international CV reviewer and career coach. Review the CV against international CV standards and modern recruitment practice, and tailor expectations to the candidate's INDUSTRY (e.g. L&D in fintech differs from L&D in pharma: regulations, keywords, tools, metrics, certifications valued). Scoring stays international. In the industry analysis only, add Saudi-market relevance where applicable (regulators, local professional certifications, Vision 2030 programs, Saudization context).
Dimensions: structure & layout; content & relevance; achievements (measurable impact); language & communication; ATS compatibility; recruiter first-10-seconds impact.
Strict rules: never invent experience, achievements, qualifications, metrics or skills absent from the CV. Distinguish clearly what the CV states from what you recommend adding (use placeholders like [add a figure if available]). Quote the CV verbatim in examples.
Write ALL output in ${L==="ar"?"clear professional Modern Standard Arabic suited to Saudi Arabia":"clear professional English"}. Return ONLY JSON, no markdown:
{"overall":0-100,"cats":{"structure":0-20,"content":0-20,"achievements":0-20,"language":0-15,"ats":0-15,"recruiter":0-10},"industry":{"fit":0-100,"summary":"3-4 sentences on how well the CV fits this industry and role","keywordsFound":[up to 8],"keywordsMissing":[up to 8 industry keywords/tools/regulations absent from the CV],"certifications":[up to 5 certifications or qualifications valued in this industry],"kpis":[up to 5 typical KPIs/metrics of this industry the candidate could quantify if true],"actions":[3 to 5 concrete steps]},"strengths":[5],"issues":[5],"examples":[{"quote":"","problem":"","why":"","fix":""}],"rewrites":[{"original":"","improved":"","note":""}x3],"verdict":"ready|minor|significant","verdictText":"short sentence"}
overall = sum of cats. examples: 3 to 5.`}

async function evaluate(ind,pasted){
  if(!API_URL)return demo();
  const role=$("role").value.trim(),content=[];
  if(fileData&&fileData.type==="pdf")content.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:fileData.data}});
  const cv=pasted||(fileData&&fileData.type==="txt"?fileData.data:"");
  content.push({type:"text",text:`Industry: ${ind}\n${role?"Target role: "+role+"\n":""}${cv?"CV text:\n"+cv:"The CV is attached as a PDF."}`});
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:MODEL,max_tokens:4000,system:sys(),messages:[{role:"user",content}]})});
  if(!r.ok)throw 0;
  const d=await r.json();
  return JSON.parse(d.content.map(c=>c.text||"").join("").replace(/```json|```/g,"").trim());
}
function demo(){const a=L==="ar";return new Promise(r=>setTimeout(()=>r({overall:62,cats:{structure:14,content:13,achievements:8,language:11,ats:10,recruiter:6},
industry:{fit:58,summary:a?"نتيجة تجريبية: اضبط API_URL للحصول على تحليل حقيقي حسب مجالك.":"Demo result: set API_URL to get a real analysis tailored to your industry.",keywordsFound:a?["إدارة المشاريع","تحليل البيانات"]:["Project management","Data analysis"],keywordsMissing:a?["الامتثال","مؤشرات الأداء"]:["Compliance","KPIs"],certifications:["PMP","CIPD"],kpis:a?["نسبة إنجاز المشاريع","خفض التكلفة"]:["Project delivery rate","Cost reduction"],actions:a?["أضف الكلمات المفتاحية المناسبة لخبرتك الفعلية"]:["Add keywords that match your real experience"]},
strengths:a?["ترتيب واضح","مؤهلات دقيقة","تسلسل زمني","طول مناسب","تنسيق متسق"]:["Clear order","Precise education","Timeline","Right length","Consistent format"],
issues:a?["لا ملخص مهني","مهام بلا نتائج","لا أرقام","كلمات مفتاحية قليلة","مهارات غير مصنفة"]:["No summary","Tasks, no results","No numbers","Few keywords","Unsorted skills"],
examples:[{quote:a?"مسؤول عن إعداد التقارير":"Responsible for reports",problem:a?"مهمة بلا أثر.":"A task with no impact.",why:a?"لا يظهر أثر عملك.":"Impact is invisible.",fix:a?"أضف النتيجة إن توفرت.":"Add the result if available."}],
rewrites:[1,2,3].map(()=>({original:a?"مسؤول عن إعداد التقارير":"Responsible for reports",improved:a?"أعددت تقارير [أضف الأثر أو الرقم].":"Prepared reports [add impact or figure].",note:a?"بلا اختلاق أرقام.":"No invented figures."})),
verdict:"significant",verdictText:a?"نتيجة تجريبية.":"Demo result."}),1500))}

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function card(title){const c=el("div","card");c.appendChild(el("h2","",title));return c}
function list(a,c){const u=el("ul","l "+(c||""));a.forEach(x=>u.appendChild(el("li","",x)));return u}

function indCard(d){
  const x=d.industry||{summary:d.industryFit||""};
  const c=card("🎯 "+t("ind"));
  if(x.fit!=null){const b=el("div","bar"),h=el("div","t");h.append(el("span","",t("fitL")),el("b","",x.fit+"%"));
    const bb=el("div","b"),sp=el("span");sp.style.width=x.fit+"%";sp.style.background="var(--cyan)";bb.appendChild(sp);b.append(h,bb);c.appendChild(b)}
  c.appendChild(el("p","",x.summary||""));
  [["found",x.keywordsFound,"ok"],["missing",x.keywordsMissing,"no"],["certs",x.certifications,"gd"],["kpis",x.kpis,"gd"]].forEach(([k,a,cl])=>{
    if(a&&a.length){c.appendChild(el("h3","",t(k)));const w=el("div","chips "+cl);a.forEach(i=>w.appendChild(el("span","",i)));c.appendChild(w)}});
  if(x.actions&&x.actions.length){c.appendChild(el("h3","",t("actions")));c.appendChild(list(x.actions))}
  c.appendChild(el("p","note",t("indNote")));
  return c}
function render(d){
  const root=$("p4");root.innerHTML="";
  const ri=rankIdx(d.overall),col=RC[ri];xp=30+d.overall;hud();$("hRank").textContent=t("ranks")[ri];
  const top=el("div","card"),row=el("div","top");
  const ring=el("div","ring");ring.style.background=`conic-gradient(${col} ${d.overall*3.6}deg,var(--navy) 0)`;
  const in_=el("div");in_.innerHTML=`${d.overall}<small>/ 100 ${t("score")}</small>`;ring.appendChild(in_);
  const s=el("div");s.appendChild(el("h1","",t("overall")));
  const rk=el("span","rank","🏅 "+t("ranks")[ri]);rk.style.background=col;s.appendChild(rk);
  s.appendChild(el("p","",t("verd")[d.verdict]||""));s.appendChild(el("p","sub",d.verdictText||""));
  row.append(ring,s);top.appendChild(row);root.appendChild(top);

  const c1=card(t("cats"));
  KEYS.forEach((k,i)=>{const v=d.cats[k]||0,b=el("div","bar"),h=el("div","t");
    h.append(el("span","",ICO[i]+" "+t("cl")[i]),el("b","",v+" / "+MAX[i]));
    const bb=el("div","b"),sp=el("span");sp.style.width=(v/MAX[i]*100)+"%";bb.appendChild(sp);b.append(h,bb);c1.appendChild(b)});
  root.appendChild(c1);

  const c2=card(t("badges")),g=el("div","badges");
  KEYS.forEach((k,i)=>{const on=(d.cats[k]||0)/MAX[i]>=.7,b=el("div","bd "+(on?"on":"off"));
    b.innerHTML=`<i>${ICO[i]}</i>`;b.appendChild(el("span","",t("cl")[i]+(on?" ★":" 🔒")));g.appendChild(b)});
  c2.appendChild(g);root.appendChild(c2);

  root.appendChild(indCard(d));
  const c4=card(t("str"));c4.appendChild(list(d.strengths));root.appendChild(c4);
  const c5=card(t("iss"));c5.appendChild(list(d.issues,"bad"));root.appendChild(c5);

  const c6=card(t("ex"));
  d.examples.forEach(x=>{const e=el("div","ex");e.appendChild(el("q","",x.quote));
    [[t("prob"),x.problem],[t("why"),x.why],[t("fix"),x.fix]].forEach(([a,b])=>{const p=el("p");p.append(el("b","",a),document.createTextNode(b));e.appendChild(p)});c6.appendChild(e)});
  root.appendChild(c6);

  const c7=card(t("rw"));
  d.rewrites.forEach(x=>{const e=el("div","ex rw");e.append(el("div","o",x.original),el("div","n",x.improved),el("p","sub",x.note));c7.appendChild(e)});
  root.appendChild(c7);

  const ag=el("button","btn alt",t("again"));
  ag.onclick=()=>{fileData=null;last=null;xp=10;hud();$("fn").dataset.i="drop";$("fn").textContent=t("drop");$("txt").value="";show("p2")};
  root.appendChild(ag);
}
applyLang();
</script>
</body>
</html>
